<style>
:root{--bg:#f3f5f7;--panel:#fff;--line:#dde2e8;--fg:#1b2430;--muted:#5f6b7a;--accent:#0f5f6b;--accent-soft:#e0f0f2;--accent-fg:#fff;--warn:#a15c00;--warn-soft:#fdf0d8;--ok:#1a7f4b;--ok-soft:#e1f4e9;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans);padding:16px}
button{font:inherit;cursor:pointer}
.mono{font-family:var(--mono)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}

.po[aria-current=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.bar input{border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:6px 10px;border-radius:6px;font:12.5px var(--mono);width:190px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:6px 12px;border-radius:6px;font-weight:600;font-size:13px}
.split{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,7fr);gap:14px;align-items:start}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:0}
.ph{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.ph h2{margin:0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hl{border-radius:3px;padding:0 3px;font-weight:600}
.hl-cpu{background:#cfe3ff;color:#0b2a55}.hl-mem{background:#e6d9ff;color:#2f1a5e}.hl-ssd{background:#cdeed9;color:#0d3b22}
.hl-color{background:#ffe2a8;color:#5a3900}.hl-kb{background:#ffd6e5;color:#5e1233}.hl-size{background:#c9eef0;color:#0b3d42}.hl-mpn{background:#e3e7ec;color:#1b2430;font-family:ui-monospace,Menlo,monospace}
:root:not([data-focus]) .hl:not(button){background:transparent;color:inherit;font-weight:inherit;padding:0}
:root[data-focus="cpu"] .hl:not(.hl-cpu):not(button){background:transparent;color:inherit;font-weight:inherit;padding:0}
:root[data-focus="mem"] .hl:not(.hl-mem):not(button){background:transparent;color:inherit;font-weight:inherit;padding:0}
:root[data-focus="ssd"] .hl:not(.hl-ssd):not(button){background:transparent;color:inherit;font-weight:inherit;padding:0}
:root[data-focus="color"] .hl:not(.hl-color):not(button){background:transparent;color:inherit;font-weight:inherit;padding:0}
:root[data-focus="kb"] .hl:not(.hl-kb):not(button){background:transparent;color:inherit;font-weight:inherit;padding:0}
:root[data-focus="size"] .hl:not(.hl-size):not(button){background:transparent;color:inherit;font-weight:inherit;padding:0}

.hlbd .hl{color:transparent!important}
button.hl{border:0;font:inherit;font-size:12px;cursor:pointer}

.ap{padding:12px 16px 16px;border-top:1px solid var(--line);display:grid;gap:8px}
.ap .btns{display:flex;flex-wrap:wrap;gap:8px}
.ap label.it{display:flex;gap:8px;font-size:13px;align-items:flex-start}

.cb-us{background:#0c2d0c;color:#86efac;border:1px solid #166534}.cb-uk{background:#1b2e4b;color:#93c5fd;border:1px solid #1d4ed8}.cb-eu{background:#1f1b3d;color:#c4b5fd;border:1px solid #5b21b6}

.big{font-size:22px;font-weight:700;letter-spacing:-.01em}
.bar input{width:280px;font-size:15px;padding:9px 12px}
.sync{color:var(--muted);font-size:12px}
.facts{padding:4px 16px 12px;margin:0}
.facts div{display:grid;grid-template-columns:100px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.facts div:first-child{border-top:0}
.facts dt{color:var(--muted);font-weight:600;font-size:13px}.facts dd{margin:0;overflow-wrap:anywhere}
.facts small{display:block;color:var(--muted);font-size:12px}
.msg{border-bottom:1px solid var(--line)}.msg:last-child{border-bottom:0}
.mh{display:flex;justify-content:space-between;gap:8px;padding:12px 16px;cursor:pointer;align-items:baseline}
.mh b{font-weight:600}.mh span{color:var(--muted);font-size:12.5px}
.snip{color:var(--muted);font-size:12.5px;padding:0 16px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mb{padding:0 16px 14px}
.meta{color:var(--muted);font-size:12px;margin-bottom:8px;overflow-wrap:anywhere}
.mb iframe{width:100%;border:0;background:#fff;border-radius:4px;min-height:60px}
.att{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:6px 10px;margin:8px 8px 0 0;font-size:12.5px;color:var(--fg);text-decoration:none;background:var(--bg)}
.chip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--warn-soft);color:var(--warn);margin-left:6px}
.reply{border-top:1px solid var(--line);padding:14px 16px;display:grid;gap:8px}
#msgs:empty + .reply{border-top:0}
.reply label{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.05em}
.reply input,.reply textarea{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit;padding:8px 10px}
.reply textarea{min-height:130px;resize:vertical}
.reply .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{background:#b3261e;color:#fff;border-color:#b3261e}
.chip.plain{background:var(--bg);color:var(--muted);border:1px solid var(--line);display:inline-block;margin:0 4px 4px 0}
.chip.ok{background:var(--ok-soft);color:var(--ok);margin:0 4px 4px 0;display:inline-block}
.note{color:var(--muted);font-size:12.5px}.empty{padding:24px 16px;color:var(--muted)}
.err{padding:16px;color:#b3261e}
select{padding:5px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg)}

<script>
// If the external initializer fails, keep order/email usable and activation safe.
// Retry loads the script again, without refreshing Gmail or replacing the composer.
window.AttachmentPreview = window.AttachmentPreview || (() => {
  const el = id => document.getElementById(id);
  let link, timer, generation = 0, scroll;
  function clear(restore = false) {
    ++generation; clearTimeout(timer);
    el("attachment-preview").hidden = true; el("thread").hidden = false;
    document.body.classList.remove("attachment-view");
    if (restore && scroll) { window.scrollTo(scroll.x, scroll.y); link?.focus({preventScroll:true}); }
  }
  function open(button) {
    link = button; scroll = {x:scrollX, y:scrollY};
    el("av-name").textContent = button.dataset.name;
    el("av-download").href = button.dataset.href;
    el("av-download").download = button.dataset.name;
    el("thread").hidden = true; el("attachment-preview").hidden = false;
    document.body.classList.add("attachment-view");
    el("av-controls").hidden = true; el("av-stage").replaceChildren();
    const failure = () => { el("av-feedback").textContent = "The attachment viewer could not start. Retry preview or use Download. If this continues, ask the app owner to check the viewer assets."; el("av-retry").hidden = false; };
    failure();
    el("av-back").onclick = () => clear(true);
    el("av-retry").onclick = () => {
      const token = ++generation, script = document.createElement("script");
      el("av-feedback").textContent = "Loading attachment viewer…"; el("av-retry").hidden = true;
      const failed = () => { if (token === generation) { ++generation; clearTimeout(timer); failure(); } };
      script.src = el("attachment-script").src + "&retry=" + Date.now();
      script.onerror = failed;
      script.onload = () => {
        if (token !== generation) return;
        clearTimeout(timer);
        if (window.AttachmentPreview === fallback) { failed(); return; }
        clear(true); window.AttachmentPreview.open(button);
      };
      timer = setTimeout(failed, 30000); document.head.append(script);
    };
    el("av-back").focus({preventScroll:true});
  }
  const fallback = {open, clear};
  return fallback;
})();
let cur=decodeURIComponent(location.hash.slice(1));try{cur=cur||localStorage.getItem("qd_last")||""}catch(e){}
let req=0,order=null,tinfo=null,statusTimer=null,statusInFlight=null;


const FLAGS={"united states":"🇺🇸","us":"🇺🇸","usa":"🇺🇸","united kingdom":"🇬🇧","uk":"🇬🇧","gb":"🇬🇧","great britain":"🇬🇧","germany":"🇩🇪","france":"🇫🇷","netherlands":"🇳🇱","spain":"🇪🇸","italy":"🇮🇹","belgium":"🇧🇪","ireland":"🇮🇪","austria":"🇦🇹","poland":"🇵🇱","portugal":"🇵🇹","sweden":"🇸🇪","denmark":"🇩🇰","finland":"🇫🇮","norway":"🇳🇴","switzerland":"🇨🇭","czech republic":"🇨🇿","czechia":"🇨🇿","romania":"🇷🇴","hungary":"🇭🇺","luxembourg":"🇱🇺","greece":"🇬🇷","croatia":"🇭🇷","slovakia":"🇸🇰","slovenia":"🇸🇮","bulgaria":"🇧🇬","estonia":"🇪🇪","latvia":"🇱🇻","lithuania":"🇱🇹","canada":"🇨🇦","australia":"🇦🇺","japan":"🇯🇵","india":"🇮🇳","singapore":"🇸🇬","mexico":"🇲🇽","brazil":"🇧🇷"};
function showCountry(sc){
  // same rules as Scout Dev's detectCountry: UK + Australia = uk group, blank/US = us, everything else = eu
  const c=(sc||"").trim().toLowerCase(),flag=FLAGS[c]||"🌍";
  let cls,label;
  if(["united kingdom","gb","uk","great britain"].includes(c)){cls="uk";label="UK"}
  else if(["australia","au"].includes(c)){cls="uk";label=sc.trim()}
  else if(["united states","us","usa",""].includes(c)){cls="us";label="US"}
  else{cls="eu";label=sc.trim()}
  const b=$("#cb");$("#usBtns").hidden=cls!=="us";b.className="cb cb-"+cls;b.textContent=flag+" "+label+" Order";b.hidden=false}

function showCto(t){
  // same rule and wording as Scout Dev: a Z-prefix MPN is a CTO; lead_time_approved decides which banner
  const b=$("#cto");if(!t.cto_detected){b.hidden=true;return}
  const mpns=[...new Set(t.cto_mpns||[])].join(", "),ok=t.lead_time_approved;
  b.className="cto "+(ok?"cto-approved":"cto-warning");
  b.textContent=ok?"This is a CTO device with an approved lead time, please proceed."+(mpns?" MPN: "+mpns:""):"⚠️ CTO — lead time not approved. A ticket is required."+(mpns?" MPN: "+mpns:"");
  b.hidden=false}

function warrantyHtml(w){
  if(!w)return "—";
  const dev=skuSummaries(w.devices,["name","plan"]).map(g=>{
    const detail=d=>`${esc(d.qty)} × ${esc(d.name.replace(/^\(UK\) \| |^\(US\) \| /,""))} <span class="chip ${/^add/i.test(d.plan)?"ok":"plain"}">${esc(d.plan)}</span>`;
    return g.details.length===1?detail(g.details[0]):`<b>${esc(g.qty)}x SKU ${esc(g.sku)}</b><small>${g.details.map(detail).join("<br>")}</small>`;
  }).join("<br>");
  // One SKU summary, with separately counted coverage/price details when they differ.
  const lines=skuSummaries(w.lines,["name","price"]).map(g=>{
    const detail=l=>`<b>${l.qty>1?esc(l.qty)+"x ":""}${esc(l.name)}</b><small>${g.details.length===1?"SKU "+esc(l.sku)+" · ":""}Unit price $${l.price.toFixed(2)}</small>`;
    return g.details.length===1?detail(g.details[0]):`<b>${esc(g.qty)}x SKU ${esc(g.sku)}</b><small>${g.details.map(detail).join("<br>")}</small>`;
  }).join("");
  return (dev||"")+(lines?`<p style="margin:6px 0 0">${lines}</p>`:"")||"—"}
function skuSummaries(lines,fields){
  const groups=[],bySku=new Map();
  for(const line of lines){
    const sku=typeof line.sku==="string"&&line.sku.trim()?line.sku:null;
    let group=sku===null?null:bySku.get(sku);
    if(!group){group={sku:line.sku,qty:0,details:[]};groups.push(group);if(sku!==null)bySku.set(sku,group)}
    group.qty+=line.qty;
    const existing=group.details.find(d=>fields.every(f=>d[f]===line[f]));
    if(existing)existing.qty+=line.qty;else group.details.push({...line});
  }
  return groups;
}
let focusK="";
function setFocus(k){focusK=k;const set=d=>{if(k)d.documentElement.dataset.focus=k;else delete d.documentElement.dataset.focus};
  set(document);document.querySelectorAll("iframe[data-html]").forEach(f=>{try{set(f.contentDocument)}catch(e){}});
  document.querySelectorAll(".legend button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.k===k)))}
document.querySelectorAll(".legend button").forEach(b=>b.onclick=()=>setFocus(focusK===b.dataset.k?"":b.dataset.k));
function wireHL(ta){
  const wrap=document.createElement("div"),bd=document.createElement("div");wrap.className="hlwrap";bd.className="hlbd";
  ta.parentNode.insertBefore(wrap,ta);wrap.append(bd,ta);
  const upd=()=>{ta.style.height="auto";ta.style.height=ta.scrollHeight+2+"px";bd.innerHTML=hl(ta.value)+"\n"};
  ta.addEventListener("input",upd);upd()}
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const HL=[["mpn",/\b[A-Z0-9]{5,7}\/[A-Z]\b|\b[Zz][0-9A-Za-z]{8,}\b/],["cpu",/\bM\d(?:\s+(?:Pro|Max|Ultra))?\b|\b\d+(?:[\u2011\u2010\-\u2013]\s?Core|\s*Core|C)\s+(?:CPU|GPU)\b/],["ssd",/\b\d+(?:\.\d)?\s?TB\b/],["mem",/\b\d{1,4}\s?GB\b/],["color",/\b(?:Space Black|Space Gr[ae]y|Silver|Midnight|Starlight|Sky Blue)\b/],["kb",/\b(?:UK|US)\s+English(?:\s+Standard)?\b/],["size",/\b1[3-6](?:"|\u201d|[- ](?:inch(?:es)?|in)\b)/]];
const HLALL=new RegExp(HL.map(x=>"("+x[1].source+")").join("|"),"gi");
function hlKind(m,i){let k=HL[i][0];if(k==="mem"&&parseInt(m)>=256)k="ssd";return k}
function hlParts(text){const out=[];let last=0,m;HLALL.lastIndex=0;
  while((m=HLALL.exec(text))){const i=m.slice(1).findIndex(x=>x!==undefined);out.push([text.slice(last,m.index)]);out.push([m[0],hlKind(m[0],i)]);last=m.index+m[0].length}
  out.push([text.slice(last)]);return out}
function hl(text){return hlParts(String(text??"")).map(p=>p[1]?`<span class="hl hl-${p[1]}">${esc(p[0])}</span>`:esc(p[0])).join("")}
function hlDom(doc){
  const st=doc.createElement("style");st.textContent=document.querySelector("style").textContent.match(/\.hl[^]*?\.legend/)[0].replace(/\.legend$/,"");doc.head.appendChild(st);
  const w=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT),nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(n=>{if(!n.nodeValue.trim()||/^(STYLE|SCRIPT)$/.test(n.parentNode.nodeName))return;const ps=hlParts(n.nodeValue);if(ps.length<3)return;
    const f=doc.createDocumentFragment();ps.forEach(p=>{if(!p[0])return;if(p[1]){const s=doc.createElement("span");s.className="hl hl-"+p[1];s.textContent=p[0];f.appendChild(s)}else f.appendChild(doc.createTextNode(p[0]))});n.parentNode.replaceChild(f,n)})}
function bar(){
  $("#bar").innerHTML=`<input id="add" placeholder="Type a PO and press Enter" value="${esc(cur)}" aria-label="PO number"><button class="btn" id="refresh">Refresh from Gmail</button>`;
  $("#add").onkeydown=e=>{if(e.key==="Enter"&&e.target.value.trim())openPO(e.target.value.trim())};
  $("#refresh").onclick=()=>{if(cur)openPO(cur)};

function statusText(value){
  return (value||"—").toLowerCase().replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase());
}
function statusCheckedText(checkedAt){
  return checkedAt?"Checked "+new Date(checkedAt*1000).toLocaleTimeString():"Status check unavailable.";
}
function stopStatusUpdates(){

}
function startStatusUpdates(po,my){

}
async function refreshOrderStatus(po=cur,my=req){
  if(!order||order.error||document.hidden||my!==req||po!==cur)return;
  if(statusInFlight&&statusInFlight.my===my)return;
  const running={my,po};statusInFlight=running;
  try{
    const resolvedPo=order.order_number||po;
    const response=await fetch("/api/order-status/"+encodeURIComponent(resolvedPo),{cache:"no-store"});
    const data=await response.json();
    if(my!==req||po!==cur)return;
    if(!response.ok||data.error||!data.status)throw new Error("Status unavailable");

    order.status=data.status;order.status_checked_at=data.status_checked_at;
    const badge=$("#order-status"),checked=$("#status-check");
    if(badge){badge.textContent=statusText(data.status);badge.title="Current status from Allwhere"}

function itemDisplayEntries(lines){

    if(entry)entry.qty+=line.qty;

       entry={...line,details:[],hasSnapshot:false,hasUnavailable:false,hasUnverified:false};
      entries.push(entry);if(key!==null)bySku.set(key,entry);
    }
     const detail=entry.details.find(d=>d.name===line.name&&d.mpn===line.mpn&&d.price===line.price);

    const existing=sku===null?null:bySku.get(sku);

}

      timer=setTimeout(()=>launch.controller.abort(),30000);
      const r=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},signal:launch.controller.signal,body:JSON.stringify({po,items:idx,text})});
      let j;try{j=await r.json()}catch(e){throw new Error("The review service returned an unreadable response. Try Open again.")}
      if(!r.ok||!j?.url)throw new Error(j?.error||"The review service is unavailable. Try Open again.");
      if(launch.cancelled||cur!==po||req!==generation)throw new Error("The order changed; the pending review was cancelled.");
      if(w.closed)throw new Error("The review tab was closed. Click Open again.");
      if(endpoint==="/api/alt-review"){
        const url=new URL(j.url,location.origin);
        if(url.origin!==location.origin||url.pathname!=="/alt-review"||!url.searchParams.get("session")||url.hash)
          throw new Error("The review service returned an invalid review link. Ask the app owner to check it.");
      }
      w.location=j.url;
      status.textContent="Review tab opened. If it does not load, use its Retry loading link or return here and click Open again. No ticket has been submitted.";
    }catch(e){
      try{launch.window?.close()}catch(closeError){}
      if(!launch.cancelled&&cur===po&&req===generation&&$("#apGo")===button)
        status.textContent="Could not open review. "+(e.name==="AbortError"?"The request timed out. Click Open again.":e.name==="SecurityError"?"The browser restricted the review tab. Allow popups or open Quote Desk outside its embedded preview, then click Open again.":e.message||"Check your connection and click Open again.");
    }finally{
      clearTimeout(timer);
      if(picker.launch===launch)picker.launch=null;
      if($("#apGo")===button)button.disabled=false;
    }
  };
}
